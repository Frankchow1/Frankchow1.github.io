<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="雁小侠Demo">
<title>雁小侠 · 作业端 Demo（P0 主链路）</title>
<style>
:root{
  --ink:#2C2C2B;--sub:#7D7A75;--line:#E6E5E3;--soft:#F9F8F7;--fill:#F0EFED;
  --blue:#2783DE;--blue-bg:#E5F2FC;
  --green:#46A171;--green-bg:#E8F1EC;
  --orange:#D5803B;--orange-bg:#FBEBDE;
  --red:#E56458;--red-bg:#FCE9E7;
  --verify:#3B5B8C;--verify-bg:#EAEFF6;
  --nonfin:#2E6B3E;--nonfin-bg:#E8F1EC;
  --sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--soft);color:var(--ink);font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:#fff;position:relative;overflow:hidden}
button{font:inherit;border:none;background:none;color:inherit;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink)}
.screen{display:flex;flex-direction:column;height:100%;min-height:0}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}

/* ── 顶部 ── */
.apphead{padding:calc(var(--sat) + 8px) 12px 0;background:#fff;border-bottom:1px solid var(--line);flex:0 0 auto}
.navrow{display:flex;align-items:center;gap:4px}
.navrow .bell{padding:8px 10px;font-size:17px;color:var(--sub);position:relative}
.tabs{flex:1;display:flex}
.tab{flex:1;text-align:center;padding:10px 2px;font-size:15px;color:var(--sub);border-bottom:2px solid transparent;position:relative;white-space:nowrap}
.tab.on{color:var(--blue);font-weight:700;border-bottom-color:var(--blue)}
.tab.rsv{flex:0 0 auto;color:#C9C7C3;font-size:12px;padding:12px 8px}
.rdot{position:absolute;top:8px;right:14%;width:7px;height:7px;border-radius:50%;background:var(--red)}
.sortbar{display:flex;gap:14px;padding:8px 14px;font-size:12.5px;color:var(--sub);background:var(--soft);border-bottom:1px solid var(--line)}
.sortbar b{color:var(--orange);font-weight:600}

/* ── 卡片 ── */
.cards{padding:12px;display:flex;flex-direction:column;gap:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card.redo{border-color:var(--red);background:var(--red-bg)}
.ctop{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;border:1px solid;border-radius:4px;padding:1px 7px;white-space:nowrap}
.tag.verify{border-color:var(--verify);color:var(--verify);background:var(--verify-bg)}
.tag.nonfin{border-color:var(--nonfin);color:var(--nonfin);background:var(--nonfin-bg)}
.tag.urgent{border-color:var(--red);color:var(--red);background:var(--red-bg);font-weight:700}
.tag.appt{border-color:var(--orange);color:#fff;background:var(--orange);font-weight:700}
.tag.state{border-color:var(--line);color:var(--sub);background:var(--soft)}
.tag.redo{border-color:var(--red);color:#fff;background:var(--red);font-weight:700}
.cname{font-weight:700;font-size:16px}
.cline{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub)}
.remain{font-weight:700;color:var(--orange)}
.remain.ok{color:var(--sub);font-weight:600}
.caddr{font-size:13px;color:var(--sub);line-height:1.5}
.caddr .nav{color:var(--blue);font-weight:600;white-space:nowrap;margin-left:6px}
.cnote{font-size:12.5px;background:#FFF7E6;border:1px solid #F5E3BE;color:#8A5A00;border-radius:8px;padding:5px 9px}
.cquota{font-size:12px;color:var(--nonfin);background:var(--nonfin-bg);border-radius:6px;padding:2px 8px;align-self:flex-start}
.ccontact{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);border-top:1px dashed var(--line);padding-top:8px}
.dial{margin-left:auto;border:1px solid var(--green);color:var(--green);border-radius:15px;padding:3px 14px;font-size:13px}
.cact{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:2px}
.btn{border:1px solid var(--line);color:var(--sub);border-radius:17px;padding:7px 16px;font-size:14px;background:#fff}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700;padding:7px 22px}
.btn.red{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn.ghost-red{border-color:var(--red);color:var(--red)}
.empty{text-align:center;color:#B9B6B1;padding:56px 20px;font-size:14px}
.empty .big{font-size:34px;margin-bottom:8px}

/* ── 详情 ── */
.dethead{display:flex;align-items:center;gap:6px;padding:calc(var(--sat) + 10px) 12px 10px;border-bottom:1px solid var(--line);flex:0 0 auto;background:#fff}
.back{font-size:20px;color:var(--sub);padding:2px 10px 2px 2px}
.dettitle{font-weight:700;font-size:16px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps{display:flex;padding:14px 10px 10px;border-bottom:1px solid var(--line)}
.step{flex:1;text-align:center;font-size:11px;color:#B9B6B1;position:relative}
.step .dot{width:14px;height:14px;border-radius:50%;border:2px solid #D8D6D2;background:#fff;margin:0 auto 4px;position:relative;z-index:1}
.step:not(:first-child):before{content:"";position:absolute;left:-50%;right:50%;top:7px;height:2px;background:#E6E5E3}
.step.done .dot,.step.now .dot{background:var(--blue);border-color:var(--blue)}
.step.done:before,.step.now:before{background:var(--blue)}
.step.now{color:var(--blue);font-weight:700}
.step.done{color:var(--sub)}
.sect{padding:14px 14px 4px;font-size:13px;color:var(--sub);font-weight:700}
.infocard{margin:8px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.irow{display:flex;justify-content:space-between;gap:14px;padding:10px 12px;font-size:14px;border-bottom:1px solid #F2F1EF}
.irow:last-child{border-bottom:none}
.irow .k{color:var(--sub);flex:0 0 auto}
.irow .v{text-align:right;min-width:0}
.irow .v.link{color:var(--blue);font-weight:600}
.apptcard{margin:8px 14px;border:1px solid #F0D8BC;border-radius:12px;background:#FFFBF4;padding:11px 13px;font-size:13.5px;line-height:1.7;color:#7A5B22}
.tl{margin:8px 14px 14px;border-left:2px solid var(--line);padding-left:14px;display:flex;flex-direction:column;gap:10px}
.tl .ev{font-size:13px;color:var(--sub);position:relative}
.tl .ev:before{content:"";position:absolute;left:-19px;top:6px;width:8px;height:8px;border-radius:50%;background:#D8D6D2}
.tl .ev b{color:var(--ink);font-weight:600}
.tl .ev .t{font-size:11.5px;color:#B9B6B1}
.botbar{flex:0 0 auto;display:flex;gap:10px;align-items:center;padding:10px 14px calc(10px + var(--sab));border-top:1px solid var(--line);background:#fff}
.botbar .btn.pri{flex:1;text-align:center;padding:12px;border-radius:12px;font-size:16px}
.botbar .btn.sec{padding:12px 16px;border-radius:12px;font-size:14px}

/* ── 作业容器 ── */
.conhead{padding:calc(var(--sat) + 8px) 12px 8px;border-bottom:1px solid var(--line);background:#fff;flex:0 0 auto}
.conh1{display:flex;align-items:center;gap:6px}
.conh1 .dettitle{font-size:15.5px}
.conh1 .anscard{border:1px solid var(--line);border-radius:14px;padding:4px 12px;font-size:12.5px;color:var(--sub);background:var(--soft)}
.conh2{display:flex;align-items:center;gap:8px;padding:5px 2px 0 30px;font-size:12px;color:var(--sub)}
.conh2 .prog{color:var(--blue);font-weight:700}
.redobanner{background:var(--red-bg);color:#B3261E;font-size:12.5px;padding:7px 14px;border-bottom:1px solid #F2CFCB}
.conbody{flex:1;display:flex;min-height:0}
.leftnav{flex:0 0 92px;background:var(--fill);overflow-y:auto;border-right:1px solid var(--line)}
.lnav{padding:13px 8px;font-size:12.5px;color:var(--sub);line-height:1.35;border-bottom:1px solid #E4E2DF;position:relative}
.lnav.on{background:#fff;color:var(--ink);font-weight:700}
.lnav.on:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;background:var(--blue);border-radius:0 2px 2px 0}
.lnav .xy{display:block;font-size:11px;color:#B9B6B1;font-weight:400;margin-top:2px}
.lnav .xy.ok{color:var(--green);font-weight:700}
.itemlist{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px;min-height:0}
.seghead{font-size:14px;font-weight:700;margin:6px 0 -4px;display:flex;justify-content:space-between;align-items:baseline}
.seghead .xy{font-size:12px;color:var(--sub);font-weight:400}
.seghead .xy.ok{color:var(--green);font-weight:700}
.item{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;display:flex;flex-direction:column;gap:8px;scroll-margin-top:8px}
.item.rej{border-color:var(--red);background:#FFF8F7}
.item.lock{opacity:.55;pointer-events:none}
.ihead{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600}
.stdot{width:9px;height:9px;border-radius:50%;background:#D8D6D2;flex:0 0 auto}
.stdot.ok{background:var(--green)}
.stdot.rej{background:var(--red)}
.req{color:var(--red);font-weight:700}
.rejtip{margin-left:auto;font-size:11px;color:var(--red);font-weight:700}
.idesc{font-size:12.5px;color:var(--sub);line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:16px;padding:6px 15px;font-size:13.5px;color:var(--sub);background:#fff}
.chip.on{border-color:var(--blue);color:var(--blue);background:var(--blue-bg);font-weight:700}
.tin{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;background:var(--soft)}
textarea.tin{resize:none;min-height:64px}
.photorow{display:flex;flex-wrap:wrap;gap:8px}
.thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.thumbwrap{position:relative}
.thumbdel{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:20px;text-align:center}
.addph{width:64px;height:64px;border:1.5px dashed #C9C7C3;border-radius:8px;color:var(--sub);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--soft)}
.addph .ic{font-size:18px}
.phcount{font-size:11.5px;color:#B9B6B1}
.exbox{height:74px;border-radius:8px;background:linear-gradient(120deg,#E9EEF4,#DCE5EE);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#8A97A8;font-size:12px}
.instrow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;background:#fff}
.instrow .arr{margin-left:auto;color:#C9C7C3}
.instrow .st{font-size:11.5px;color:var(--sub)}
.instrow .st.ok{color:var(--green);font-weight:700}
.instrow .st.nf{color:var(--orange);font-weight:700}
.addinst{border:1.5px dashed #C9C7C3;border-radius:10px;padding:11px;text-align:center;color:var(--sub);font-size:13.5px;background:var(--soft)}

/* ── 弹层 ── */
#layer{position:fixed;inset:0;z-index:50;display:none}
#layer.show{display:block}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:#fff;border-radius:16px 16px 0 0;padding:10px 16px calc(16px + var(--sab));max-height:86dvh;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.sheet.full{top:calc(var(--sat) + 44px);border-radius:16px 16px 0 0}
.handle{width:36px;height:4px;background:#D8D6D2;border-radius:2px;margin:0 auto}
.shtitle{font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.shtitle .x{color:var(--sub);font-size:18px;padding:2px 6px}
.shrow{display:flex;flex-direction:column;gap:6px;font-size:14px}
.shrow .lbl{color:var(--sub);font-size:13px}
.shbtns{display:flex;gap:10px;margin-top:4px}
.shbtns .btn{flex:1;text-align:center;padding:11px;border-radius:12px;font-size:15px}
.misslist{display:flex;flex-direction:column;gap:8px}
.missrow{display:flex;align-items:center;gap:8px;border:1px solid #F2CFCB;background:var(--red-bg);border-radius:10px;padding:10px 12px;font-size:13.5px;color:#B3261E}
.missrow .arr{margin-left:auto}
.anssec{font-size:13px;font-weight:700;color:var(--sub);margin-top:4px}
.ansgrid{display:flex;flex-wrap:wrap;gap:8px}
.ansdot{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);font-size:11px;color:var(--sub);display:flex;align-items:center;justify-content:center;background:var(--soft)}
.ansdot.ok{background:var(--green-bg);border-color:#BFDCCB;color:var(--green);font-weight:700}
.ansdot.rej{background:var(--red-bg);border-color:#F2CFCB;color:var(--red);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%);background:rgba(30,30,30,.88);color:#fff;font-size:13.5px;padding:9px 18px;border-radius:20px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80%;text-align:center}
#toast.show{opacity:1}
#dbgBtn{position:fixed;right:14px;bottom:calc(120px + var(--sab));z-index:40;width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.12);font-size:18px;color:var(--sub)}
.uploading{position:fixed;inset:0;z-index:60;background:rgba(255,255,255,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.pbar{width:200px;height:8px;background:var(--fill);border-radius:5px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
.dbgrow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;background:var(--soft)}
.dbgrow .ic{font-size:16px}
.dbgrow .d{font-size:11.5px;color:var(--sub);display:block}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<div id="toast"></div>
<button id="dbgBtn" onclick="openDebug()">⚙︎</button>
<input type="file" id="camInput" accept="image/*" capture="environment" style="display:none">
<script>
/* ═════ 配置层：业务差异全部由这里驱动（模拟后台配置 JSON） ═════ */
const BIZ = {
  verify: {
    name:'见证核实', mode:'sliding', needAppt:true,
    nodes:['启动任务','上门核实预约','上门采集','审核'],
    groups:[
      {id:'vg1',name:'企业基础信息',items:[
        {id:'v1',name:'企业名称与执照是否一致',type:'radio',req:1,options:['一致','不一致']},
        {id:'v2',name:'实际经营地址核对',type:'radio',req:1,options:['与注册一致','不一致']},
        {id:'v3',name:'法人/联系人是否在场',type:'radio',req:1,options:['在场','不在场']}]},
      {id:'vg2',name:'场地情况',items:[
        {id:'v4',name:'门头照',type:'photo',req:1,max:3,desc:'正对门头拍摄，招牌完整清晰，含左右门框；避免逆光与遮挡'},
        {id:'v5',name:'内景照',type:'photo',req:1,max:5,desc:'站在门口向内拍摄，覆盖主要办公/经营区域'},
        {id:'v6',name:'场地性质',type:'radio',req:1,options:['自有','租赁','共享工位']}]},
      {id:'vg3',name:'经营情况',items:[
        {id:'v7',name:'是否有实际经营迹象',type:'radio',req:1,options:['有','无']},
        {id:'v8',name:'员工人数（估）',type:'number',req:0},
        {id:'v9',name:'主营业务描述',type:'text',req:1}]},
      {id:'vg4',name:'风险判断与补充',items:[
        {id:'v10',name:'是否存在风险迹象',type:'radio',req:1,options:['无','有（备注说明）']},
        {id:'v11',name:'补充说明',type:'text',req:0}]}]
  },
  nonfin: {
    name:'非金核查', mode:'matrix', needAppt:false,
    nodes:['启动任务','上门采集','审核'],
    groups:[
      {id:'ng1',name:'基础信息',items:[
        {id:'n1',name:'门头照',type:'photo',req:1,max:3,desc:'正对门头，招牌完整入镜；如招牌与主档不符请在商户信息卡核对更新'},
        {id:'n2',name:'店内全景照',type:'photo',req:1,max:3,desc:'覆盖主货架与收银台'}]},
      {id:'ng2',name:'货架陈列',items:[
        {id:'n3',name:'主货架陈列照',type:'photo',req:1,max:5,desc:'正面拍摄本品牌排面，价签清晰可读'},
        {id:'n4',name:'本品排面数',type:'number',req:1},
        {id:'n5',name:'是否有二次陈列',type:'radio',req:1,options:['有','无']}]},
      {id:'ng3',name:'冰柜',repeat:{preset:['元气森林冰柜 1','元气森林冰柜 2'],addable:true,sub:[
        {id:'f1',name:'冰柜正面照',type:'photo',req:1,max:3,desc:'品牌贴纸完整入镜，柜门关闭状态'},
        {id:'f2',name:'纯净度是否达标',type:'radio',req:1,options:['达标','不达标']},
        {id:'f3',name:'资产编码',type:'text',req:0}]}},
      {id:'ng4',name:'售价采集',items:[
        {id:'n6',name:'气泡水 480ml 售价（元）',type:'number',req:1},
        {id:'n7',name:'乳茶 450ml 售价（元）',type:'number',req:1},
        {id:'n8',name:'价签是否规范',type:'radio',req:1,options:['规范','不规范']}]}]
  }
};

/* ═════ 演示数据 ═════ */
function seed(){return {tab:'new',screen:'home',cur:null,curGroup:null,tasks:[
  {id:'T1',biz:'verify',status:'new',sub:null,name:'深圳云腾信息科技有限公司',proj:'开户见证核实 · 7月批次',addr:'南山区科技园南区 R2-B 栋 1103 室',dist:'2.3km',remain:'剩 26 小时',urgent:true,note:'需法人在场，携带营业执照原件',contact:{n:'刘经理',p:'138****6621'},ans:{},ph:{},reps:{},comms:[],appt:null,rej:[]},
  {id:'T2',biz:'nonfin',status:'new',sub:null,name:'美宜佳便利店（科技园店）',proj:'非金 · 7月饮料陈列检查',addr:'南山区高新南一道 12 号裙楼 102',dist:'1.1km',remain:'最晚提交 今日 20:00',urgent:false,note:'重点拍冰柜纯净度，价签需清晰',quota:'配额 12/40',contact:{n:'店长王姐',p:'139****0832'},ans:{},ph:{},reps:{},comms:[],appt:null,rej:[]},
  {id:'T3',biz:'nonfin',status:'new',sub:null,name:'天天鲜生活超市（白石洲店）',proj:'非金 · 7月饮料陈列检查',addr:'南山区白石洲二路 8 号',dist:'4.6km',remain:'最晚提交 明日 12:00',urgent:false,quota:'配额 12/40',contact:null,ans:{},ph:{},reps:{},comms:[],appt:null,rej:[]}
]}}
const KEY='yxx_demo_p0_v1';
let S; try{S=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){S=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function task(id){return S.tasks.find(t=>t.id===id)}
function bz(t){return BIZ[t.biz]}
function now(){const d=new Date();return `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
function comm(t,txt){t.comms.unshift({txt,at:now()})}

/* ═════ 完成度引擎（单一口径，顶栏/左栏/答题卡/提交同源） ═════ */
function ensureReps(t){const B=bz(t);B.groups.forEach(g=>{if(g.repeat&&!t.reps[g.id]){t.reps[g.id]=g.repeat.preset.map((nm,i)=>({id:g.id+'_i'+i,name:nm,preset:true,nf:false,ans:{},ph:{}}))}})}
function itemDone(t,it,inst){const src=inst||t;if(it.type==='photo')return (src.ph[it.id]||[]).length>0;const a=src.ans[it.id];return a!==undefined&&a!==null&&a!==''}
function instDone(g,inst,t){if(inst.nf)return true;return g.repeat.sub.every(s=>!s.req||itemDone(t,s,inst))}
function groupStat(t,g){ensureReps(t);if(g.repeat){const L=t.reps[g.id]||[];return{done:L.filter(i=>instDone(g,i,t)).length,total:L.length}}return{done:g.items.filter(it=>itemDone(t,it)).length,total:g.items.length}}
function totalStat(t){let d=0,n=0;bz(t).groups.forEach(g=>{const s=groupStat(t,g);d+=s.done;n+=s.total});return{done:d,total:n}}
function missing(t){const out=[];const redo=t.sub==='待补录';bz(t).groups.forEach(g=>{if(g.repeat){(t.reps[g.id]||[]).forEach(inst=>{if(inst.nf)return;g.repeat.sub.forEach(s=>{if(s.req&&!itemDone(t,s,inst)&&(!redo||t.rej.includes(g.id)))out.push({g,it:s,inst,label:inst.name+' · '+s.name})})})}else{g.items.forEach(it=>{if(it.req&&!itemDone(t,it)&&(!redo||t.rej.includes(it.id)))out.push({g,it,label:g.name+' · '+it.name})})}});return out}

/* ═════ 状态机：新任务 → 执行中 → 审核中（待补录循环） ═════ */
function accept(id){const t=task(id);t.status='doing';t.sub=bz(t).needAppt?'待预约':'待上门';comm(t,'接单成功');save();S.tab='doing';render();toast('已接单 → 进入执行中'+(bz(t).needAppt?'（需先预约）':''))}
function mainAction(id){const t=task(id);if(t.status==='new'){accept(id);return}
 if(t.sub==='待预约'){openAppt(id);return}
 S.cur=id;S.curGroup=bz(t).groups[0].id;ensureReps(t);if(t.sub==='待上门'){t.sub='采集中';comm(t,'开始采集')}
 S.screen='container';save();render()}
function mainLabel(t){if(t.status==='new')return'接单';if(t.sub==='待预约')return'去预约';if(t.sub==='待上门')return'去采集';if(t.sub==='采集中')return'继续采集';if(t.sub==='待补录')return'去补录';return'查看'}
function openDetail(id){S.cur=id;S.screen='detail';save();render()}
function goHome(){S.screen='home';S.cur=null;save();render()}

/* 拨打 / 退回 / 转派 */
function dial(id){const t=task(id);comm(t,'拨打电话 · '+t.contact.n+' '+t.contact.p);save();toast('已记入作业沟通记录');location.href='tel:13800000000'}
function openReturn(id){openSheet(`<div class="shtitle">退回任务<button class="x" onclick="closeSheet()">✕</button></div>
<div class="shrow"><span class="lbl">退回原因（必填）</span><textarea class="tin" id="retReason" placeholder="如：距离过远 / 时间冲突 / 无法联系商户…"></textarea></div>
<div class="shbtns"><button class="btn" onclick="closeSheet()">取消</button><button class="btn red" onclick="doReturn('${id}')">确认退回</button></div>`)}
function doReturn(id){const r=$('retReason').value.trim();if(!r){toast('退回必须填写原因');return}S.tasks=S.tasks.filter(t=>t.id!==id);closeSheet();goHome();toast('已退回任务池（原因已记录）')}
function openTransfer(id){const ppl=['陈小飞 · 南山组','黄志强 · 南山组','李雪 · 福田组'];openSheet(`<div class="shtitle">转派 · 选择转派人<button class="x" onclick="closeSheet()">✕</button></div>
${ppl.map(p=>`<button class="dbgrow" onclick="doTransfer('${id}','${p}')"><span class="ic">👤</span>${p}</button>`).join('')}`)}
function doTransfer(id,p){S.tasks=S.tasks.filter(t=>t.id!==id);closeSheet();goHome();toast('已转派给 '+p.split(' ')[0])}

/* 预约（半屏弹层，4 项） */
let AP={};
function openAppt(id){AP={ok:'是',time:'',addr:'原地址',newaddr:'',note:''};renderAppt(id)}
function renderAppt(id){const t=task(id);const times=['今天 14:00–16:00','今天 16:00–18:00','明天 09:30–11:30','明天 14:00–16:00'];
openSheet(`<div class="shtitle">预约登记<button class="x" onclick="closeSheet()">✕</button></div>
<div class="shrow"><span class="lbl">是否预约成功 <span class="req">*</span></span><div class="chips">${['是','否（约不上）'].map(o=>`<button class="chip ${AP.ok===o?'on':''}" onclick="AP.ok='${o}';renderAppt('${id}')">${o}</button>`).join('')}</div></div>
${AP.ok==='是'?`<div class="shrow"><span class="lbl">预约上门时间 <span class="req">*</span></span><div class="chips">${times.map(o=>`<button class="chip ${AP.time===o?'on':''}" onclick="AP.time='${o}';renderAppt('${id}')">${o}</button>`).join('')}</div></div>
<div class="shrow"><span class="lbl">预约地址 <span class="req">*</span></span><div class="chips">${['原地址','新地址'].map(o=>`<button class="chip ${AP.addr===o?'on':''}" onclick="AP.addr='${o}';renderAppt('${id}')">${o}</button>`).join('')}</div>${AP.addr==='新地址'?`<input class="tin" placeholder="输入新的上门地址（将同步最新作业地址）" value="${esc(AP.newaddr)}" onchange="AP.newaddr=this.value">`:''}</div>`:''}
<div class="shrow"><span class="lbl">备注${AP.ok!=='是'?'（约不上请说明）':'（选填）'}</span><input class="tin" placeholder="备注说明" value="${esc(AP.note)}" onchange="AP.note=this.value"></div>
<div class="shbtns"><button class="btn" onclick="closeSheet()">取消</button><button class="btn pri" onclick="saveAppt('${id}')">保存</button></div>`)}
function saveAppt(id){const t=task(id);
 if(AP.ok==='是'){if(!AP.time){toast('请选择预约时间');return}
  const addr=AP.addr==='新地址'?(AP.newaddr.trim()||''):t.addr;if(AP.addr==='新地址'&&!addr){toast('请输入新地址');return}
  t.appt={time:AP.time,addr};if(AP.addr==='新地址'){t.addr=addr;comm(t,'预约新地址 · 已同步最新作业地址')}
  t.sub='待上门';comm(t,'预约成功 · '+AP.time+(AP.note?'（'+AP.note+'）':''));toast('预约成功 → 待上门')
 }else{if(!AP.note.trim()){toast('约不上需填写备注');return}comm(t,'约不上 · '+AP.note);toast('已记录「约不上」，任务仍待预约')}
 save();closeSheet();render()}
</script>
<script>
/* ═════ 首页：三状态 Tab ═════ */
function cardsFor(tab){if(tab==='new')return S.tasks.filter(t=>t.status==='new');
 if(tab==='doing')return S.tasks.filter(t=>t.status==='doing');
 return S.tasks.filter(t=>t.status==='review').sort((a,b)=>(b.sub==='待补录')-(a.sub==='待补录'))}
function stateTag(t){if(t.status==='new')return t.urgent?'<span class="tag urgent">加急</span>':'';
 if(t.status==='doing'){if(t.sub==='待预约')return'<span class="tag appt">⏰ 待预约 · T+0</span>';return`<span class="tag state">${t.sub}</span>`}
 if(t.sub==='待补录')return'<span class="tag redo">待补录</span>';return'<span class="tag state">待审核</span>'}
function cardHTML(t){const B=bz(t);const showTools=t.status!=='new';
 const acts=(()=>{if(t.status==='review'){return t.sub==='待补录'?`<button class="btn red" onclick="mainAction('${t.id}')">去补录</button>`:`<button class="btn" onclick="openDetail('${t.id}')">查看</button>`}
  const tools=t.status==='doing'?`<button class="btn" onclick="openReturn('${t.id}')">退回</button><button class="btn" onclick="openTransfer('${t.id}')">转派</button>`:'';return tools+`<button class="btn pri" onclick="mainAction('${t.id}')">${mainLabel(t)}</button>`})();
 const lastComm=t.comms.find(c=>c.txt.startsWith('约不上')||c.txt.startsWith('预约成功'));
 return`<div class="card ${t.sub==='待补录'?'redo':''}">
  <div class="ctop"><span class="tag ${t.biz}">${B.name}</span>${stateTag(t)}${t.quota?`<span class="cquota">${t.quota}</span>`:''}</div>
  <div class="cname" onclick="openDetail('${t.id}')">${esc(t.name)}</div>
  <div class="cline"><span class="remain ${t.urgent?'':'ok'}">${t.remain}</span><span>📍 ${t.dist}</span></div>
  <div class="caddr" onclick="toast('唤起导航（demo 模拟）')">${esc(t.proj)}<br>${esc(t.addr)}<span class="nav">导航 ›</span></div>
  ${t.note?`<div class="cnote">📌 ${esc(t.note)}</div>`:''}
  ${lastComm&&t.status==='doing'?`<div class="cnote" style="background:#FDF3F1;border-color:#F2CFCB;color:#B3261E">${esc(lastComm.txt)} · ${lastComm.at}</div>`:''}
  ${showTools&&t.contact?`<div class="ccontact">👤 ${t.contact.n} · ${t.contact.p}<button class="dial" onclick="dial('${t.id}')">📞 拨打</button></div>`:''}
  <div class="cact">${acts}</div></div>`}
function homeHTML(){const hasRedo=S.tasks.some(t=>t.sub==='待补录');
 const tabs=[['new','新任务'],['doing','执行中'],['review','审核中']];
 const list=cardsFor(S.tab);
 const sort={new:'派单时间⇅ · 任务类型▾ · 距离⇅ · 截止⇅',doing:'智能排序（默认） · 预约时间⇅ · 距离⇅',review:'待补录置顶 · 提交时间⇅'}[S.tab];
 return`<div class="screen"><div class="apphead"><div class="navrow">
  <div class="tabs">${tabs.map(([k,n])=>`<button class="tab ${S.tab===k?'on':''}" onclick="S.tab='${k}';save();render()">${n}${k==='review'&&hasRedo?'<span class="rdot"></span>':''}</button>`).join('')}<button class="tab" onclick="openRoute()">路线规划</button></div>
  <button class="bell" onclick="openStats()">📊</button><button class="bell" onclick="toast('通知中心（占位）')">🔔</button></div></div>
 <div class="sortbar">${sort.split(' · ').map((s,i)=>i===0?`<b>${s}</b>`:`<span>${s}</span>`).join('')}</div>
 <div class="scroll">${S.tab==='new'&&typeof grabEntry==='function'?grabEntry():''}<div class="cards">${list.length?list.map(cardHTML).join(''):`<div class="empty"><div class="big">📬</div>暂无任务<br><span style="font-size:12px">可在右下角 ⚙︎ 调试面板重置演示数据</span></div>`}</div></div></div>`}

/* ═════ 任务详情 ═════ */
function nodeIdx(t){const B=bz(t);if(t.status==='new')return 0;if(t.status==='review')return B.nodes.length-1;
 if(B.needAppt)return t.sub==='待预约'?1:2;return 1}
function detailHTML(){const t=task(S.cur);const B=bz(t);const ni=nodeIdx(t);
 return`<div class="screen"><div class="dethead"><button class="back" onclick="goHome()">‹</button><div class="dettitle">任务详情</div>${stateTag(t)}</div>
 <div class="scroll">
  <div class="steps">${B.nodes.map((n,i)=>`<div class="step ${i<ni?'done':i===ni?'now':''}"><div class="dot"></div>${n}</div>`).join('')}</div>
  <div class="sect">任务信息</div>
  <div class="infocard">
   <div class="irow"><span class="k">企业/门店</span><span class="v"><b>${esc(t.name)}</b></span></div>
   <div class="irow"><span class="k">项目</span><span class="v">${esc(t.proj)}</span></div>
   <div class="irow"><span class="k">剩余时间</span><span class="v" style="color:var(--orange);font-weight:700">${t.remain}</span></div>
   <div class="irow"><span class="k">地址</span><span class="v link" onclick="toast('唤起导航（demo 模拟）')">${esc(t.addr)} ›</span></div>
   ${t.quota?`<div class="irow"><span class="k">配额</span><span class="v">${t.quota}（提交时校验）</span></div>`:''}
   ${t.contact&&t.status!=='new'?`<div class="irow"><span class="k">联系人</span><span class="v">${t.contact.n} · ${t.contact.p} <span class="link" onclick="dial('${t.id}')">📞</span></span></div>`:''}
   ${t.note?`<div class="irow"><span class="k">备注</span><span class="v" style="color:#8A5A00">${esc(t.note)}</span></div>`:''}
  </div>
  ${B.needAppt&&t.status!=='new'?`<div class="sect">预约信息（只显最新）</div><div class="apptcard">${t.appt?`⏰ ${t.appt.time}<br>📍 ${esc(t.appt.addr)}`:'暂无预约记录，点击下方「去预约」登记'}</div>`:''}
  ${t.comms.length?`<div class="sect">作业沟通记录（只增不改）</div><div class="tl">${t.comms.map(c=>`<div class="ev"><b>${esc(c.txt)}</b><br><span class="t">${c.at}</span></div>`).join('')}</div>`:''}
  ${t.status==='review'?`<div class="sect">采集结果</div><div class="infocard"><div class="irow"><span class="k">已采集</span><span class="v">${totalStat(t).done}/${totalStat(t).total} 项${t.rej.length?` · <span style="color:var(--red);font-weight:700">${t.rej.length} 项被驳回</span>`:''}</span></div></div>`:''}
  <div style="height:16px"></div>
 </div>
 <div class="botbar">${t.status==='review'&&t.sub!=='待补录'?`<button class="btn sec" style="flex:1" onclick="S.cur='${t.id}';S.screen='container';S.curGroup=bz(task('${t.id}')).groups[0].id;save();render()">查看采集内容（只读）</button>`:
  `${t.status==='doing'?`<button class="btn sec" onclick="openReturn('${t.id}')">退回</button><button class="btn sec" onclick="openTransfer('${t.id}')">转派</button>`:''}<button class="btn pri ${t.sub==='待补录'?'red':''}" onclick="mainAction('${t.id}')">${mainLabel(t)}</button>`}</div></div>`}

/* ═════ 作业容器 ═════ */
function editable(t,itemId,gid){if(t.status==='review'&&t.sub!=='待补录')return false;if(t.sub==='待补录')return t.rej.includes(itemId)||(gid&&t.rej.includes(gid));return true}
function itemHTML(t,g,it,inst){const src=inst||t;const done=itemDone(t,it,inst);const rej=t.rej.includes(it.id)&&t.sub==='待补录';
 const canEdit=inst?editable(t,g.id):editable(t,it.id);
 const instArg=inst?`'${g.id}','${inst.id}'`:`null,null`;
 let body='';
 if(it.type==='radio'){body=`<div class="chips">${it.options.map(o=>`<button class="chip ${src.ans[it.id]===o?'on':''}" onclick="setAns('${it.id}','${o}',${instArg})">${o}</button>`).join('')}</div>`}
 else if(it.type==='number'){body=`<input class="tin" type="number" inputmode="decimal" placeholder="请输入数值" value="${src.ans[it.id]??''}" onchange="setAns('${it.id}',this.value,${instArg})">`}
 else if(it.type==='text'){body=`<textarea class="tin" placeholder="请输入" onchange="setAns('${it.id}',this.value,${instArg})">${esc(src.ans[it.id]??'')}</textarea>`}
 else if(it.type==='photo'){const arr=src.ph[it.id]||[];
  body=`${it.desc?`<div class="exbox" onclick="toast('示例大图（demo 占位，真实环境为参考拍摄示例）')">🖼 示例图 · 点击放大</div>`:''}
  <div class="photorow">${arr.map((p,i)=>`<div class="thumbwrap"><img class="thumb" src="${p}"><button class="thumbdel" onclick="delPhoto('${it.id}',${i},${instArg})">✕</button></div>`).join('')}
  ${arr.length<it.max?`<button class="addph" onclick="takePhoto('${it.id}',${instArg},1)"><span class="ic">📷</span>拍照</button><button class="addph" onclick="takePhoto('${it.id}',${instArg},0)"><span class="ic">⚡</span>模拟</button>`:''}</div>
  <div class="phcount">${arr.length}/${it.max} 张${arr.length>=it.max?' · 已达上限':''}</div>`}
 return`<div class="item ${rej?'rej':''} ${canEdit?'':'lock'}" id="it_${inst?inst.id+'_':''}${it.id}">
  <div class="ihead"><span class="stdot ${rej?'rej':done?'ok':''}"></span>${it.req?'<span class="req">*</span>':''}${esc(it.name)}${rej?'<span class="rejtip">被驳回 · 请重新采集</span>':''}</div>
  ${it.desc&&it.type!=='photo'?`<div class="idesc">${esc(it.desc)}</div>`:''}
  ${body}</div>`}
function repeatHTML(t,g){ensureReps(t);const L=t.reps[g.id];const canEdit=editable(t,g.id);
 return`<div class="item ${canEdit?'':'lock'}" id="it_${g.id}">
  <div class="ihead"><span class="stdot ${L.length&&L.every(i=>instDone(g,i,t))?'ok':''}"></span>${esc(g.name)}（可重复 · ${L.length} 台）</div>
  ${L.map(inst=>`<div class="instrow" onclick="openInst('${g.id}','${inst.id}')"><span class="stdot ${inst.nf?'':instDone(g,inst,t)?'ok':''}" style="${inst.nf?'background:var(--orange)':''}"></span>${esc(inst.name)}<span class="st ${inst.nf?'nf':instDone(g,inst,t)?'ok':''}">${inst.nf?'未找到':instDone(g,inst,t)?'已完成':g.repeat.sub.filter(s=>itemDone(t,s,inst)).length+'/'+g.repeat.sub.length}</span><span class="arr">›</span></div>`).join('')}
  ${g.repeat.addable?`<button class="addinst" onclick="addInst('${g.id}')">＋ 新增冰柜（现场新增可删除）</button>`:''}</div>`}
function containerHTML(){const t=task(S.cur);const B=bz(t);ensureReps(t);const st=totalStat(t);
 const readonly=t.status==='review'&&t.sub!=='待补录';const redo=t.sub==='待补录';
 let body='';
 if(B.mode==='matrix'){const cg=B.groups.find(g=>g.id===S.curGroup)||B.groups[0];
  body=`<div class="conbody"><div class="leftnav">${B.groups.map(g=>{const s=groupStat(t,g);return`<button class="lnav ${g.id===cg.id?'on':''}" onclick="S.curGroup='${g.id}';save();render()">${g.name}<span class="xy ${s.done===s.total&&s.total>0?'ok':''}">${s.done===s.total&&s.total>0?'✓ ':''}${s.done}/${s.total}</span></button>`}).join('')}</div>
  <div class="itemlist" id="ilist">${cg.repeat?repeatHTML(t,cg):cg.items.map(it=>itemHTML(t,cg,it)).join('')}<div style="height:8px"></div></div></div>`}
 else{body=`<div class="conbody"><div class="itemlist" id="ilist">${B.groups.map(g=>{const s=groupStat(t,g);return`<div class="seghead" id="seg_${g.id}">${g.name}<span class="xy ${s.done===s.total?'ok':''}">${s.done===s.total?'✓ 已完成':s.done+'/'+s.total}</span></div>`+(g.repeat?repeatHTML(t,g):g.items.map(it=>itemHTML(t,g,it)).join(''))}).join('')}<div style="height:8px"></div></div></div>`}
 return`<div class="screen"><div class="conhead">
  <div class="conh1"><button class="back" onclick="exitContainer()">‹</button><div class="dettitle">${esc(t.name)}</div><button class="anscard" onclick="openAnswerCard()">答题卡</button></div>
  <div class="conh2"><span>${esc(t.proj)}</span><span class="prog" style="margin-left:auto">已完成 ${st.done}/${st.total}</span></div></div>
 ${redo?`<div class="redobanner">⚠︎ 补录模式：仅被驳回采集项可修改，其余只读</div>`:''}
 ${readonly?`<div class="redobanner" style="background:var(--fill);color:var(--sub);border-color:var(--line)">已提交 · 只读查看</div>`:''}
 ${typeof mcardHTML==="function"?mcardHTML(t):""}
 ${body}
 <div class="botbar">${readonly?`<button class="btn pri" style="flex:1" onclick="exitContainer()">返回</button>`:`<span style="font-size:11.5px;color:#B9B6B1">自动暂存<br>已开启</span><button class="btn pri ${redo?'red':''}" onclick="trySubmit()">${redo?'重新提交（仅补驳回项）':'提交'}</button>`}</div></div>`}
function exitContainer(){const t=task(S.cur);if(t.status==='review'){S.screen='detail'}else{S.screen='home';S.tab='doing'}save();render()}
</script>
<script>
/* ═════ 答题输入 / 拍照 ═════ */
function findInst(gid,iid){const t=task(S.cur);return (t.reps[gid]||[]).find(i=>i.id===iid)}
function rerender(){const el=$('ilist');const y=el?el.scrollTop:0;render();const el2=$('ilist');if(el2)el2.scrollTop=y}
function setAns(itemId,val,gid,iid){const t=task(S.cur);const src=(gid&&iid)?findInst(gid,iid):t;src.ans[itemId]=val;save();
 if(gid&&iid&&INST.open){renderInst(gid,iid)}else{rerender()}}
let CAM={item:null,gid:null,iid:null};
function takePhoto(itemId,gid,iid,real){CAM={item:itemId,gid,iid};
 if(real){$('camInput').value='';$('camInput').click()}else{addPhoto(mockPhoto(itemId))}}
function mockPhoto(itemId){const c=document.createElement('canvas');c.width=320;c.height=240;const x=c.getContext('2d');
 const hues=[210,150,30,270,190];const h=hues[Math.floor(Math.random()*hues.length)];
 const gr=x.createLinearGradient(0,0,320,240);gr.addColorStop(0,`hsl(${h},32%,82%)`);gr.addColorStop(1,`hsl(${h},28%,64%)`);
 x.fillStyle=gr;x.fillRect(0,0,320,240);x.fillStyle='rgba(255,255,255,.75)';x.fillRect(0,180,320,60);
 x.fillStyle='#444';x.font='bold 18px sans-serif';x.fillText('📷 模拟拍摄',16,206);
 x.font='12px sans-serif';x.fillStyle='#666';x.fillText(now()+' · GPS 水印（被动留痕）',16,226);
 return c.toDataURL('image/jpeg',.8)}
function addPhoto(dataURL){const t=task(S.cur);const src=(CAM.gid&&CAM.iid)?findInst(CAM.gid,CAM.iid):t;
 if(!src.ph[CAM.item])src.ph[CAM.item]=[];src.ph[CAM.item].push(dataURL);save();
 if(CAM.gid&&CAM.iid&&INST.open){renderInst(CAM.gid,CAM.iid)}else{rerender()}}
function delPhoto(itemId,idx,gid,iid){const t=task(S.cur);const src=(gid&&iid)?findInst(gid,iid):t;src.ph[itemId].splice(idx,1);save();
 if(gid&&iid&&INST.open){renderInst(gid,iid)}else{rerender()}}
$('camInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const s=Math.min(1,640/img.width);c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);addPhoto(c.toDataURL('image/jpeg',.75))};img.src=r.result};r.readAsDataURL(f)});

/* ═════ 可重复采集项：实例详情页（底部滑入全屏） ═════ */
let INST={open:false};
function openInst(gid,iid){INST={open:true};renderInst(gid,iid)}
function renderInst(gid,iid){const t=task(S.cur);const B=bz(t);const g=B.groups.find(x=>x.id===gid);const inst=findInst(gid,iid);
 const canEdit=editable(t,gid);
 openSheet(`<div class="shtitle">${esc(inst.name)}<button class="x" onclick="closeInst()">∨ 收起</button></div>
 ${inst.nf?`<div class="redobanner" style="border-radius:8px">已标记「未找到/不适用」，不计入必填</div>`:''}
 ${g.repeat.sub.map(s=>itemHTML(t,g,s,inst)).join('')}
 <div class="shbtns">${canEdit?`<button class="btn" onclick="toggleNF('${gid}','${iid}')">${inst.nf?'取消未找到':'标记未找到'}</button>${inst.preset?'':`<button class="btn ghost-red" onclick="delInst('${gid}','${iid}')">删除</button>`}`:''}
 <button class="btn pri" onclick="closeInst()">完成（自动暂存）</button></div>`,true)}
function closeInst(){INST={open:false};closeSheet();render()}
function toggleNF(gid,iid){const inst=findInst(gid,iid);inst.nf=!inst.nf;save();renderInst(gid,iid)}
function addInst(gid){const t=task(S.cur);ensureReps(t);const L=t.reps[gid];const n=L.length+1;
 L.push({id:gid+'_x'+Date.now(),name:'元气森林冰柜 '+n+'（新增）',preset:false,nf:false,ans:{},ph:{}});save();render();
 openInst(gid,L[L.length-1].id)}
function delInst(gid,iid){const t=task(S.cur);t.reps[gid]=t.reps[gid].filter(i=>i.id!==iid);save();closeInst()}

/* ═════ 答题卡 ═════ */
function openAnswerCard(){const t=task(S.cur);const B=bz(t);
 openSheet(`<div class="shtitle">答题卡 · 已完成 ${totalStat(t).done}/${totalStat(t).total}<button class="x" onclick="closeSheet()">✕</button></div>
 ${B.groups.map(g=>{const s=groupStat(t,g);let dots='';
  if(g.repeat){dots=(t.reps[g.id]||[]).map((inst,i)=>`<button class="ansdot ${inst.nf?'':instDone(g,inst,t)?'ok':''}" onclick="jumpTo('${g.id}',null)">${inst.nf?'—':'柜'+(i+1)}</button>`).join('')}
  else{dots=g.items.map((it,i)=>`<button class="ansdot ${t.rej.includes(it.id)&&t.sub==='待补录'?'rej':itemDone(t,it)?'ok':''}" onclick="jumpTo('${g.id}','${it.id}')">${i+1}</button>`).join('')}
  return`<div class="anssec">${g.name} · ${s.done}/${s.total}</div><div class="ansgrid">${dots}</div>`}).join('')}`)}
function jumpTo(gid,itemId){const t=task(S.cur);closeSheet();
 if(bz(t).mode==='matrix'){S.curGroup=gid;save();render()}
 requestAnimationFrame(()=>{const el=itemId?$('it_'+itemId):$('seg_'+gid)||$('it_'+gid);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})})}

/* ═════ 提交闭环：校验 → 未完成直跳 → 确认 → 上传 → 审核中 ═════ */
function trySubmit(){const t=task(S.cur);if(t.quota&&S.quotaFull){openSheet(`<div class="shtitle">⛔ 配额已满，无法提交<button class="x" onclick="closeSheet()">✕</button></div><div style="font-size:14px;color:var(--sub);line-height:1.8">「非金 · 7月饮料陈列检查」项目配额已用完（40/40），本单无法提交（硬拦截）。<br>已采集内容已本地保存，如需扩容请联系项目经理。</div><div class="shbtns"><button class="btn pri" onclick="closeSheet()">知道了</button></div>`);return}const miss=missing(t);
 if(miss.length){openSheet(`<div class="shtitle">还有 ${miss.length} 项未完成<button class="x" onclick="closeSheet()">✕</button></div>
  <div class="misslist">${miss.slice(0,8).map(m=>`<button class="missrow" onclick="jumpTo('${m.g.id}',${m.inst?'null':`'${m.it.id}'`})">❗ ${esc(m.label)}<span class="arr">去完成 ›</span></button>`).join('')}${miss.length>8?`<div style="font-size:12px;color:var(--sub);text-align:center">…等共 ${miss.length} 项</div>`:''}</div>`);return}
 const redo=t.sub==='待补录';const st=totalStat(t);
 openSheet(`<div class="shtitle">确认提交<button class="x" onclick="closeSheet()">✕</button></div>
 <div style="font-size:14px;color:var(--sub);line-height:1.8">${esc(t.name)}<br>已完成 <b style="color:var(--ink)">${st.done}/${st.total}</b> 项${redo?'（本次仅重交被驳回项）':''}<br>提交后照片统一上传，弱网自动续传${t.quota?'<br><span style="color:var(--orange)">提交时将校验项目配额（硬拦截）</span>':''}</div>
 <div class="shbtns"><button class="btn" onclick="closeSheet()">再检查</button><button class="btn pri" onclick="doSubmit()">确认提交</button></div>`)}
function doSubmit(){closeSheet();const t=task(S.cur);
 const up=document.createElement('div');up.className='uploading';up.innerHTML=`<div style="font-size:15px;font-weight:700">正在统一上传采集包…</div><div class="pbar"><i id="pb"></i></div><div style="font-size:12px;color:var(--sub)">弱网可续传 · demo 模拟</div>`;document.body.appendChild(up);
 let p=0;const h=setInterval(()=>{p+=25;$('pb').style.width=p+'%';if(p>=100){clearInterval(h);setTimeout(()=>{up.remove();
  const redo=t.sub==='待补录';t.status='review';t.sub='待审核';if(redo)t.rej=[];else{S.subCnt=(S.subCnt||0)+1;S.subBiz=S.subBiz||{};S.subBiz[t.biz]=(S.subBiz[t.biz]||0)+1}comm(t,redo?'补录重新提交成功':'提交成功 · 进入审核');
  S.screen='home';S.tab='review';save();render();toast(redo?'补录已重新提交 → 待审核':'提交成功 → 审核中（完成口径=提交）')},250)}},220)}

/* ═════ 调试面板：模拟后台事件 ═════ */
function openDebug(){const reviewable=S.tasks.filter(t=>t.status==='review'&&t.sub==='待审核');
 openSheet(`<div class="shtitle">🛠 调试面板（模拟后台）<button class="x" onclick="closeSheet()">✕</button></div>
 <button class="dbgrow" ${reviewable.length?'':'style="opacity:.45"'} onclick="dbgReject()"><span class="ic">❌</span><span>模拟审核驳回<span class="d">随机驳回待审核单的 2 个采集项 → 进入待补录</span></span></button>
 <button class="dbgrow" ${reviewable.length?'':'style="opacity:.45"'} onclick="dbgPass()"><span class="ic">✅</span><span>模拟审核通过<span class="d">待审核单全部通过并归档</span></span></button>
 <button class="dbgrow" onclick="dbgFill()"><span class="ic">⚡</span><span>一键填完当前任务<span class="d">给正在采集的任务自动补齐剩余项（加速演示）</span></span></button>
 <button class="dbgrow" onclick="S.quotaFull=!S.quotaFull;save();closeSheet();toast('模拟配额已满：'+(S.quotaFull?'开启，非金单提交将被拦截':'已关闭'))"><span class="ic">🚧</span><span>模拟配额已满（当前：${S.quotaFull?'开':'关'}）<span class="d">开启后非金任务提交时触发硬拦截</span></span></button><button class="dbgrow" onclick="if(confirm('重置所有演示数据？')){localStorage.removeItem(KEY);location.reload()}"><span class="ic">🔄</span><span>重置演示数据<span class="d">清空进度，回到初始 3 个新任务</span></span></button>
 <div style="font-size:11.5px;color:#B9B6B1;line-height:1.7">P0 主链路：接单 → 预约（核实）→ 采集（矩阵式/滑动分段式）→ 提交 → 审核中 → 驳回补录 → 重提。P1 已加：抢单地图/圈选/批量/配额拦截、路线规划、作业统计。</div>`)}
function dbgReject(){const t=S.tasks.find(x=>x.status==='review'&&x.sub==='待审核');if(!t){toast('没有待审核的任务');return}
 const flat=[];bz(t).groups.forEach(g=>{if(g.repeat){flat.push({id:g.id,label:g.name})}else{g.items.forEach(it=>{if(it.req)flat.push({id:it.id,label:g.name+' · '+it.name})})}});
 const pick=flat.sort(()=>Math.random()-.5).slice(0,2);t.rej=pick.map(p=>p.id);t.sub='待补录';
 comm(t,'审核驳回 · '+pick.map(p=>p.label).join('；'));save();closeSheet();S.screen='home';S.tab='review';render();
 toast('已驳回 2 项 → 待补录置顶（审核中 Tab 亮红点）')}
function dbgPass(){const t=S.tasks.find(x=>x.status==='review'&&x.sub==='待审核');if(!t){toast('没有待审核的任务');return}
 S.tasks=S.tasks.filter(x=>x.id!==t.id);S.passCnt=(S.passCnt||0)+1;save();closeSheet();render();toast('「'+t.name+'」审核通过，已归档')}
function dbgFill(){const t=S.tasks.find(x=>x.id===S.cur&&x.status==='doing')||S.tasks.find(x=>x.sub==='采集中')||S.tasks.find(x=>x.sub==='待补录');
 if(!t){toast('没有正在采集的任务（先点去采集）');return}
 S.cur=t.id;ensureReps(t);
 const fill=(src,it)=>{if(itemDone(t,it,src===t?null:src))return;
  if(it.type==='photo'){src.ph[it.id]=[mockPhoto(it.id)]}
  else if(it.type==='radio'){src.ans[it.id]=it.options[0]}
  else if(it.type==='number'){src.ans[it.id]=String(Math.floor(Math.random()*8)+2)}
  else{src.ans[it.id]='（调试自动填充）现场情况正常'}};
 const redo=t.sub==='待补录';
 bz(t).groups.forEach(g=>{if(g.repeat){if(redo&&!t.rej.includes(g.id))return;(t.reps[g.id]||[]).forEach(inst=>{if(!inst.nf)g.repeat.sub.forEach(s=>fill(inst,s))})}
  else g.items.forEach(it=>{if(redo&&!t.rej.includes(it.id))return;if(it.req)fill(t,it)})});
 save();closeSheet();if(S.screen!=='container'){S.screen='container';S.curGroup=bz(t).groups[0].id}render();toast('已自动填完，可直接提交')}

/* ═════ 弹层 & 主渲染 ═════ */
function openSheet(html,full){$('layer').innerHTML=`<div class="dim" onclick="${INST.open?'closeInst()':'closeSheet()'}"></div><div class="sheet ${full?'full':''}"><div class="handle"></div>${html}</div>`;$('layer').classList.add('show')}
function closeSheet(){INST={open:false};$('layer').classList.remove('show');$('layer').innerHTML=''}
function render(){const scr=S.screen;let html='';
 if(scr==='detail'&&task(S.cur))html=detailHTML();
 else if(scr==='container'&&task(S.cur))html=containerHTML();
 else if(scr==='grab')html=grabHTML();
 else if(scr==='route')html=routeHTML();
 else{S.screen='home';html=homeHTML()}
 $('app').innerHTML=html}
render();
</script>

<script>
/* ═════ P1：抢单（模拟地图 + 圈选 + 批量 + 并发 + 配额拦截） ═════ */
const QUOTA_REMAIN=3;
let GRAB={sel:[],lasso:false,view:'map',keep:[]};
function poolInit(){if(!S.pool){S.pool=[
 {id:'g1',biz:'nonfin',name:'华润万家（后海店）',short:'华润万家',addr:'南山区后海大道 233 号',dist:'0.8km',x:28,y:30},
 {id:'g2',biz:'nonfin',name:'7‑ELEVEn（深大地铁店）',short:'7‑11',addr:'南山区深南大道 9689 号',dist:'1.2km',x:56,y:22},
 {id:'g3',biz:'verify',name:'深圳蓝海智创科技有限公司',short:'蓝海智创',addr:'南山区软件产业基地 4 栋',dist:'2.1km',x:68,y:42},
 {id:'g4',biz:'nonfin',name:'天虹超市（南山店）',short:'天虹超市',addr:'南山区南海大道天虹大厦',dist:'1.6km',x:40,y:56},
 {id:'g5',biz:'nonfin',name:'便利蜂（科兴科学园店）',short:'便利蜂',addr:'南山区科兴科学园 B 座',dist:'2.4km',x:62,y:70},
 {id:'g6',biz:'verify',name:'前海云创网络科技有限公司',short:'前海云创',addr:'前海卓越金融中心 12 层',dist:'3.0km',x:20,y:74}];save()}}
function grabEntry(){poolInit();if(!S.pool.length)return'';return`<button class="grabentry" onclick="openGrab()">🗺 附近抢单<span class="hint">地图圈选 · 批量接单 · 配额拦截</span><span class="sub">可抢 ${S.pool.length} 单 ›</span></button>`}
function openGrab(){poolInit();GRAB={sel:[],lasso:false,view:'map',keep:[]};S.screen='grab';save();render()}
function togglePick(id){const i=GRAB.sel.indexOf(id);if(i>=0)GRAB.sel.splice(i,1);else GRAB.sel.push(id);render()}
function doLasso(){GRAB.lasso=true;const cx=45,cy=42,r=28;GRAB.sel=S.pool.filter(p=>Math.hypot(p.x-cx,p.y-cy)<=r).map(p=>p.id);render();toast('圈选命中 '+GRAB.sel.length+' 单，可继续点选调整')}
function grabHTML(){poolInit();const sel=GRAB.sel;const mapv=GRAB.view==='map';
 const dots=S.pool.map(p=>`<button class="mdot ${p.biz==='verify'?'v':'n'} ${sel.includes(p.id)?'on':''}" style="left:${p.x}%;top:${p.y}%" onclick="togglePick('${p.id}')"><span class="pin">${p.biz==='verify'?'核':'非'}</span><br><span class="nm">${p.short} · ${p.dist}</span></button>`).join('');
 return`<div class="screen"><div class="dethead"><button class="back" onclick="goHome()">‹</button><div class="dettitle">附近抢单 · 可抢 ${S.pool.length} 单</div><button class="anscard" onclick="doLasso()">◯ 圈选</button></div>
 <div class="mtabs"><button class="mtab ${mapv?'on':''}" onclick="GRAB.view='map';render()">地图</button><button class="mtab ${mapv?'':'on'}" onclick="GRAB.view='list';render()">列表</button></div>
 ${mapv?`<div class="mapwrap"><div class="map">
  <div class="mroad" style="left:0;right:0;top:36%;height:14px"></div>
  <div class="mroad" style="top:0;bottom:0;left:48%;width:12px"></div>
  <div class="mroad" style="left:0;right:0;top:76%;height:10px"></div>
  <div class="mriver" style="right:-50px;top:-70px;width:170px;height:170px"></div>
  ${GRAB.lasso?`<div class="lasso" style="left:17%;top:14%;width:56%;height:56%"></div>`:''}
  ${dots}
  <div class="maphint">模拟地图：点击点位多选，或右上角「圈选」框选一片。蓝=见证核实 绿=非金核查</div></div></div>`
 :`<div class="scroll" style="padding-top:10px">${S.pool.map(p=>`<div class="poolrow ${sel.includes(p.id)?'on':''}" onclick="togglePick('${p.id}')"><span class="lck">${sel.includes(p.id)?'✓':''}</span><span style="flex:1"><b style="font-size:14px">${esc(p.name)}</b><br><span style="font-size:12px;color:var(--sub)">${p.biz==='verify'?'见证核实':'非金核查'} · ${p.dist} · ${esc(p.addr)}</span></span></div>`).join('')}</div>`}
 <div class="botbar"><span style="font-size:12px;color:var(--sub)">已选 <b style="color:var(--blue)">${sel.length}</b> 单<br>非金配额剩 ${QUOTA_REMAIN} 单</span><button class="btn pri" ${sel.length?'':'style="opacity:.5"'} onclick="batchGrab()">批量抢单（${sel.length}）</button></div></div>`}
function batchGrab(){if(!GRAB.sel.length)return;const sel=GRAB.sel.map(id=>S.pool.find(p=>p.id===id)).filter(Boolean);

BIZ.nonfin={name:'非金核查',mode:'matrix',needAppt:false,nodes:['启动任务','信息采集','审核'],groups:[

 {id:'pg_shelf',name:'货架',minRep:true,repeat:{unit:'货架',tag:'架',preset:['货架 1'],addable:true,sub:[

  emptyHint:'勾选上方品牌后自动生成对应冰柜采集卡；也可点左侧「冰柜」页签上的 ＋ 手动新增',

 {id:'pg_sec',name:'二次陈列',minRep:true,showRepIf:t=>t.ans.d1==='是',items:[

/* ═════ 引擎扩展：条件显隐 / 混合分组 / 多选 / 录音 ═════ */
function p3vis(t,it){return !it.showIf||it.showIf(t)}
function repA(t,g){return !g.showRepIf||g.showRepIf(t)}
function ensureReps(t){const B=bz(t);B.groups.forEach(g=>{if(g.repeat&&!t.reps[g.id]){t.reps[g.id]=(g.repeat.preset||[]).map((nm,i)=>({id:g.id+'_i'+i,name:nm,preset:true,nf:false,ans:{},ph:{}}))}})}
function itemDone(t,it,inst){const src=inst||t;if(it.type==='photo')return (src.ph[it.id]||[]).length>0;const a=src.ans[it.id];if(Array.isArray(a))return a.length>0;return a!==undefined&&a!==null&&a!==''}
function instDone(g,inst,t){if(inst.nf)return true;return g.repeat.sub.filter(s=>!s.showIfInst||s.showIfInst(inst)).every(s=>!s.req||itemDone(t,s,inst))}
function groupStat(t,g){ensureReps(t);let d=0,n=0;
 (g.items||[]).filter(it=>p3vis(t,it)).forEach(it=>{n++;if(itemDone(t,it))d++});
 if(g.repeat&&repA(t,g)){const L=t.reps[g.id]||[];n+=L.length;d+=L.filter(i=>instDone(g,i,t)).length}
 return{done:d,total:n}}
function missing(t){const out=[];const redo=t.sub==='待补录';bz(t).groups.forEach(g=>{
 (g.items||[]).filter(it=>p3vis(t,it)).forEach(it=>{if(it.req&&!itemDone(t,it)&&(!redo||t.rej.includes(it.id)))out.push({g,it,label:g.name+' · '+it.name})});
 if(g.repeat&&repA(t,g)){const L=t.reps[g.id]||[];
  if(g.minRep&&!L.length&&!redo)out.push({g,it:{id:g.id,name:g.name},label:g.name+' · 至少添加 1 个'+(g.repeat.unit||'实例')});
  L.forEach(inst=>{if(inst.nf)return;g.repeat.sub.filter(s=>!s.showIfInst||s.showIfInst(inst)).forEach(s=>{if(s.req&&!itemDone(t,s,inst)&&(!redo||t.rej.includes(g.id)))out.push({g,it:s,inst,label:inst.name+' · '+s.name})})})}});return out}
let REC={item:null,t0:0};
function recStart(id){REC={item:id,t0:Date.now()};rerender()}
function recStop(id){const s=Math.max(6,Math.round((Date.now()-REC.t0)/1000)+34);REC={item:null,t0:0};setAns(id,'录音 00:'+String(Math.min(59,s)).padStart(2,'0')+' · 已保存（模拟）',null,null)}
function toggleMulti(itemId,opt){const t=task(S.cur);const arr=t.ans[itemId]=(t.ans[itemId]||[]);const i=arr.indexOf(opt);if(i>=0)arr.splice(i,1);else arr.push(opt);
 if(itemId==='fz1')syncFridge(t);save();rerender()}
function syncFridge(t){ensureReps(t);const sel=t.ans['fz1']||[];const L=t.reps['pg_fridge']||[];
 sel.forEach(b=>{if(!L.some(i=>i.ans.fr0===b))L.push({id:'pg_fridge_a'+Math.random().toString(36).slice(2,9),name:(b==='冷风柜'?b:b+'冰柜'),preset:false,auto:true,nf:false,ans:{fr0:b},ph:{}})});
 t.reps['pg_fridge']=L.filter(i=>{if(!i.auto)return true;if(sel.includes(i.ans.fr0))return true;
  return Object.keys(i.ph||{}).some(k=>(i.ph[k]||[]).length)||Object.keys(i.ans).length>1})}
function setAns(itemId,val,gid,iid){const t=task(S.cur);const src=(gid&&iid)?findInst(gid,iid):t;src.ans[itemId]=val;
 if(itemId==='fr0'&&gid&&iid){src.name=(val==='冷风柜'?val:val+'冰柜')}
 save();if(gid&&iid&&INST.open){renderInst(gid,iid)}else{rerender()}}
function itemHTML(t,g,it,inst){const src=inst||t;const done=itemDone(t,it,inst);const rej=t.rej.includes(it.id)&&t.sub==='待补录';
 const canEdit=inst?editable(t,g.id):editable(t,it.id);
 const instArg=inst?`'${g.id}','${inst.id}'`:`null,null`;
 let body='';
 if(it.type==='radio'){body=`<div class="chips">${it.options.map(o=>`<button class="chip ${src.ans[it.id]===o?'on':''}" onclick="setAns('${it.id}','${o}',${instArg})">${o}</button>`).join('')}</div>`}
 else if(it.type==='multi'){const arr=src.ans[it.id]||[];
  body=`<div class="chips">${it.options.map(o=>`<button class="chip ${arr.includes(o)?'on':''}" onclick="toggleMulti('${it.id}','${o}')">${o}</button>`).join('')}</div><div class="phcount">已选 ${arr.length} 个品牌 · 勾选后自动生成对应冰柜采集卡</div>`}
 else if(it.type==='audio'){const a=src.ans[it.id];
  body=a?`<div class="recpill done">🎙 ${esc(a)}<button class="mlink" style="margin-left:8px" onclick="setAns('${it.id}',null,${instArg})">重录</button></div>`
  :(REC.item===it.id?`<button class="recpill on" onclick="recStop('${it.id}')"><span class="recdot"></span>录音中… 点击结束</button>`
  :`<button class="recpill" onclick="recStart('${it.id}')">🎙 开始录音（demo 模拟）</button>`)}
 else if(it.type==='number'){body=`<input class="tin" type="number" inputmode="decimal" placeholder="请输入数值" value="${src.ans[it.id]??''}" onchange="setAns('${it.id}',this.value,${instArg})">`}
 else if(it.type==='text'){body=`<textarea class="tin" placeholder="请输入" onchange="setAns('${it.id}',this.value,${instArg})">${esc(src.ans[it.id]??'')}</textarea>`}
 else if(it.type==='photo'){const arr=src.ph[it.id]||[];
  body=`${it.desc?`<div class="exbox" onclick="toast('示例大图（demo 占位，真实环境为参考拍摄示例）')">🖼 示例图 · 点击放大</div>`:''}
  <div class="photorow">${arr.map((p,i)=>`<div class="thumbwrap"><img class="thumb" src="${p}"><button class="thumbdel" onclick="delPhoto('${it.id}',${i},${instArg})">✕</button></div>`).join('')}
  ${arr.length<it.max?`<button class="addph" onclick="takePhoto('${it.id}',${instArg},1)"><span class="ic">📷</span>拍照</button><button class="addph" onclick="takePhoto('${it.id}',${instArg},0)"><span class="ic">⚡</span>模拟</button>`:''}</div>
  <div class="phcount">${arr.length}/${it.max} 张${arr.length>=it.max?' · 已达上限':''}</div>`}
 return (it.sect?`<div class="skuhead">${it.sect}</div>`:'')+`<div class="item ${rej?'rej':''} ${canEdit?'':'lock'}" id="it_${inst?inst.id+'_':''}${it.id}">
  <div class="ihead"><span class="stdot ${rej?'rej':done?'ok':''}"></span>${it.req?'<span class="req">*</span>':''}${esc(it.name)}${rej?'<span class="rejtip">被驳回 · 请重新采集</span>':''}</div>
  ${it.desc&&it.type!=='photo'?`<div class="idesc">${esc(it.desc)}</div>`:''}
  ${body}</div>`}
function repeatHTML(t,g){ensureReps(t);const L=t.reps[g.id]||[];const canEdit=editable(t,g.id);
 const head=(g.items||[]).filter(it=>p3vis(t,it)).map(it=>itemHTML(t,g,it)).join('');
 if(!repA(t,g))return head;
 const unit=(g.repeat&&g.repeat.unit)||'实例';
 return head+`<div class="item ${canEdit?'':'lock'}" id="it_${g.id}">
  <div class="ihead"><span class="stdot ${L.length&&L.every(i=>instDone(g,i,t))?'ok':''}"></span>${esc(g.name)}可重复采集（${L.length} 个${unit}）</div>
  ${L.length?L.map(inst=>{const subv=g.repeat.sub.filter(s=>!s.showIfInst||s.showIfInst(inst));return`<div class="instrow" onclick="openInst('${g.id}','${inst.id}')"><span class="stdot ${inst.nf?'':instDone(g,inst,t)?'ok':''}" style="${inst.nf?'background:var(--orange)':''}"></span>${esc(inst.name)}<span class="st ${inst.nf?'nf':instDone(g,inst,t)?'ok':''}">${inst.nf?'未找到':instDone(g,inst,t)?'已完成':subv.filter(s=>itemDone(t,s,inst)).length+'/'+subv.length}</span><span class="arr">›</span></div>`}).join(''):`<div class="idesc" style="padding:4px 2px">${g.emptyHint||('点左侧「'+g.name+'」页签上的 ＋ 新增'+unit)}</div>`}</div>`}
function containerHTML(){const t=task(S.cur);const B=bz(t);ensureReps(t);const st=totalStat(t);
 const readonly=t.status==='review'&&t.sub!=='待补录';const redo=t.sub==='待补录';
 let body='';
 if(B.mode==='matrix'){const cg=B.groups.find(g=>g.id===S.curGroup)||B.groups[0];
  body=`<div class="conbody"><div class="leftnav">${B.groups.map(g=>{const s=groupStat(t,g);const add=g.repeat&&g.repeat.addable&&!readonly;return`<button class="lnav ${g.id===cg.id?'on':''}" onclick="S.curGroup='${g.id}';save();render()">${g.name}${add?`<span class="lnavadd" onclick="event.stopPropagation();tabAdd('${g.id}')">＋</span>`:''}<span class="xy ${s.done===s.total&&s.total>0?'ok':''}">${s.done===s.total&&s.total>0?'✓ ':''}${s.done}/${s.total}</span></button>`}).join('')}</div>
  <div class="itemlist" id="ilist">${cg.repeat?repeatHTML(t,cg):cg.items.filter(it=>p3vis(t,it)).map(it=>itemHTML(t,cg,it)).join('')}<div style="height:8px"></div></div></div>`}
 else{body=`<div class="conbody"><div class="itemlist" id="ilist">${B.groups.map(g=>{const s=groupStat(t,g);return`<div class="seghead" id="seg_${g.id}">${g.name}<span class="xy ${s.done===s.total?'ok':''}">${s.done===s.total?'✓ 已完成':s.done+'/'+s.total}</span></div>`+(g.repeat?repeatHTML(t,g):g.items.filter(it=>p3vis(t,it)).map(it=>itemHTML(t,g,it)).join(''))}).join('')}<div style="height:8px"></div></div></div>`}
 return`<div class="screen"><div class="conhead">
  <div class="conh1"><button class="back" onclick="exitContainer()">‹</button><div class="dettitle">${esc(t.name)}</div><button class="anscard" onclick="openAnswerCard()">答题卡</button></div>
  <div class="conh2"><span>${esc(t.proj)}</span><span class="prog" style="margin-left:auto">已完成 ${st.done}/${st.total}</span></div></div>
 ${redo?`<div class="redobanner">⚠︎ 补录模式：仅被驳回采集项可修改，其余只读</div>`:''}
 ${readonly?`<div class="redobanner" style="background:var(--fill);color:var(--sub);border-color:var(--line)">已提交 · 只读查看</div>`:''}
 ${typeof mcardHTML==="function"?mcardHTML(t):""}
 ${body}
 <div class="botbar">${readonly?`<button class="btn pri" style="flex:1" onclick="exitContainer()">返回</button>`:`<span style="font-size:11.5px;color:#B9B6B1">自动暂存<br>已开启</span><button class="btn pri ${redo?'red':''}" onclick="trySubmit()">${redo?'重新提交（仅补驳回项）':'提交'}</button>`}</div></div>`}
function tabAdd(gid){const t=task(S.cur);const g=bz(t).groups.find(x=>x.id===gid);S.curGroup=gid;save();
 if(g.showRepIf&&!g.showRepIf(t)){render();toast('请先在本页选择「'+g.items[0].name+' = 是」');return}
 if(!editable(t,gid)){render();toast('当前状态不可编辑');return}
 addInst(gid)}
function addInst(gid){const t=task(S.cur);ensureReps(t);const g=bz(t).groups.find(x=>x.id===gid);const L=t.reps[gid];const unit=(g.repeat&&g.repeat.unit)||'实例';
 L.push({id:gid+'_x'+Date.now(),name:unit+' '+(L.length+1)+'（新增）',preset:false,nf:false,ans:{},ph:{}});save();render();
 openInst(gid,L[L.length-1].id)}
function renderInst(gid,iid){const t=task(S.cur);const g=bz(t).groups.find(x=>x.id===gid);const inst=findInst(gid,iid);
 const canEdit=editable(t,gid);
 const subs=g.repeat.sub.filter(s=>!s.showIfInst||s.showIfInst(inst));
 openSheet(`<div class="shtitle">${esc(inst.name)}<button class="x" onclick="closeInst()">∨ 收起</button></div>
 ${inst.nf?`<div class="redobanner" style="border-radius:8px">已标记「未找到/不适用」，不计入必填</div>`:''}
 ${subs.map(s=>itemHTML(t,g,s,inst)).join('')}
 <div class="shbtns">${canEdit?`<button class="btn" onclick="toggleNF('${gid}','${iid}')">${inst.nf?'取消未找到':'标记未找到'}</button>${inst.preset?'':`<button class="btn ghost-red" onclick="delInst('${gid}','${iid}')">删除</button>`}`:''}
 <button class="btn pri" onclick="closeInst()">完成（自动暂存）</button></div>`,true)}
function openAnswerCard(){const t=task(S.cur);const B=bz(t);
 openSheet(`<div class="shtitle">答题卡 · 已完成 ${totalStat(t).done}/${totalStat(t).total}<button class="x" onclick="closeSheet()">✕</button></div>
 ${B.groups.map(g=>{const s=groupStat(t,g);let dots='';
  dots+=(g.items||[]).filter(it=>p3vis(t,it)).map((it,i)=>`<button class="ansdot ${t.rej.includes(it.id)&&t.sub==='待补录'?'rej':itemDone(t,it)?'ok':''}" onclick="jumpTo('${g.id}','${it.id}')">${i+1}</button>`).join('');
  if(g.repeat&&repA(t,g))dots+=(t.reps[g.id]||[]).map((inst,i)=>`<button class="ansdot ${inst.nf?'':instDone(g,inst,t)?'ok':''}" onclick="jumpTo('${g.id}',null)">${(g.repeat.tag||'柜')+(i+1)}</button>`).join('');
  return`<div class="anssec">${g.name} · ${s.done}/${s.total}</div><div class="ansgrid">${dots||'—'}</div>`}).join('')}`)}
function collectInfoHTML(t){ensureReps(t);return bz(t).groups.map(g=>{const s=groupStat(t,g);
 let rows=(g.items||[]).filter(it=>p3vis(t,it)).map(it=>`<div class="irow"><span class="k">${it.req?'<span class="req">*</span> ':''}${esc(it.name)}${t.rej.includes(it.id)&&t.sub==='待补录'?'<span class="rejtip">被驳回</span>':''}</span><span class="v" style="color:${itemDone(t,it)?'var(--green)':'var(--sub)'}">${itemDone(t,it)?'✓ 已完成':'未完成'}</span></div>`).join('');
 if(g.repeat&&repA(t,g))rows+=(t.reps[g.id]||[]).map(i=>`<div class="irow"><span class="k">${esc(i.name)}</span><span class="v" style="color:${i.nf?'var(--orange)':instDone(g,i,t)?'var(--green)':'var(--sub)'}">${i.nf?'未找到':instDone(g,i,t)?'✓ 已完成':'未完成'}</span></div>`).join('');
 return`<div class="sect">${g.name} · ${s.done}/${s.total}</div><div class="infocard">${rows||'<div class="irow"><span class="k">（按前置答案联动展开）</span><span class="v"></span></div>'}</div>`}).join('')}
function previewHTML(t){return`<div class="sect">采集内容（只读预览 · 接单后进入采集）</div>`+bz(t).groups.map(g=>{
 const items=(g.items||[]).filter(it=>!it.showIf);
 return`<div class="infocard" style="margin-bottom:8px"><div class="irow"><span class="k"><b>${g.name}</b></span><span class="v">${g.repeat?'可重复':items.length+' 项'}</span></div>
 ${items.map(it=>`<div class="irow"><span class="k">${it.req?'<span class="req">*</span> ':''}${esc(it.name)}</span><span class="v">${it.type==='photo'?'拍照':it.type==='radio'?'单选':it.type==='multi'?'多选':it.type==='audio'?'录音':it.type==='number'?'数值':'文本'}</span></div>`).join('')}
 ${g.repeat?g.repeat.sub.filter(s=>!s.showIfInst).map(s=>`<div class="irow"><span class="k">${s.req?'<span class="req">*</span> ':''}${esc(s.name)}</span><span class="v">每${g.repeat.unit||'实例'}</span></div>`).join(''):''}
 ${g.previewNote?`<div class="irow"><span class="k" style="color:#8A5A00">${g.previewNote}</span><span class="v"></span></div>`:''}</div>`}).join('')}
function dbgFill(){const t=S.tasks.find(x=>x.id===S.cur&&x.status==='doing')||S.tasks.find(x=>x.sub==='采集中')||S.tasks.find(x=>x.sub==='待补录');
 if(!t){toast('没有正在采集的任务（先点去采集）');return}
 S.cur=t.id;ensureReps(t);
 const fill=(src,it)=>{if(itemDone(t,it,src===t?null:src))return;
  if(it.type==='photo'){src.ph[it.id]=[mockPhoto(it.id)]}
  else if(it.type==='radio'){src.ans[it.id]=it.options[0]}
  else if(it.type==='multi'){src.ans[it.id]=[it.options[0],it.options[3]]}
  else if(it.type==='audio'){src.ans[it.id]='录音 00:47 · 已保存（模拟）'}
  else if(it.type==='number'){src.ans[it.id]=String((Math.random()*6+3).toFixed(1))}
  else{src.ans[it.id]='（调试自动填充）现场情况正常'}};
 const redo=t.sub==='待补录';
 bz(t).groups.forEach(g=>{(g.items||[]).filter(it=>p3vis(t,it)).forEach(it=>{if(redo&&!t.rej.includes(it.id))return;if(it.req)fill(t,it)})});
 if(t.ans.fz1)syncFridge(t);
 bz(t).groups.forEach(g=>{if(!g.repeat||!repA(t,g))return;
  if(g.minRep&&!(t.reps[g.id]||[]).length&&!redo){t.reps[g.id].push({id:g.id+'_x'+Date.now(),name:(g.repeat.unit||'实例')+' 1（新增）',preset:false,nf:false,ans:{},ph:{}})}
  (t.reps[g.id]||[]).forEach(inst=>{if(inst.nf)return;if(redo&&!t.rej.includes(g.id))return;
   g.repeat.sub.filter(s=>!s.showIfInst||s.showIfInst(inst)).forEach(s=>{if(s.req)fill(inst,s)})})});
 save();closeSheet();if(S.screen!=='container'){S.screen='container';S.curGroup=bz(t).groups[0].id}render();toast('已自动填完，可直接提交')}
render();
</script>
</body>
</html>
